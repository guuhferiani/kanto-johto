plugins {
    id 'com.android.application'
}

android {
    namespace 'com.antigravity.pokemonkantojohto'
    compileSdk 34

    defaultConfig {
        applicationId "com.antigravity.pokemonkantojohto"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
                storePassword "pokemonkj"
                keyAlias "pokemonkj"
                keyPassword "pokemonkj"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'gba'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
