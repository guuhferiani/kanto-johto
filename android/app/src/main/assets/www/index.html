<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pokémon Kanto & Johto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="console-chassis">
        <!-- Floating Minimalist Quick Toolbar -->
        <header id="quick-toolbar">
            <div class="toolbar-brand">
                <span class="toolbar-title">POKÉMON KANTO & JOHTO</span>
            </div>
            <div class="toolbar-actions">
                <button id="btn-turbo" class="tool-pill" title="Turbo">⚡ 1x</button>
                <button id="btn-save-state" class="tool-pill" title="Salvar">💾 Salvar</button>
                <button id="btn-load-state" class="tool-pill" title="Carregar">📂 Carregar</button>
                <button id="btn-mute" class="tool-pill" title="Áudio">🔊</button>
                <button id="btn-settings" class="tool-pill" title="Ajustes">⚙️</button>
            </div>
        </header>

        <!-- Top Display Area (Screen Inside Authentic GBA Bezel) -->
        <section id="display-section">
            <div id="screen-bezel">
                <div class="bezel-top-bar">
                    <span class="power-led"><i class="led-dot"></i> POWER</span>
                    <span class="battery-label">GBA CORE</span>
                </div>

                <div id="screen-viewport">
                    <!-- Loading & Splash Screen -->
                    <div id="loading-overlay">
                        <div class="loader-content">
                            <img src="icon.png" alt="Capa Pokémon Kanto & Johto" id="splash-icon">
                            <h2 id="loader-title">Pokémon Kanto & Johto</h2>
                            <p id="loader-sub">Iniciando emulador offline...</p>
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <!-- Screen Canvas Target -->
                    <div id="emulator-target">
                        <canvas id="emulator-canvas"></canvas>
                    </div>
                </div>

                <div class="bezel-bottom-bar">
                    <span class="gba-logo">GAME BOY <em>ADVANCE</em></span>
                </div>
            </div>
        </section>

        <!-- Lower Controller Section (Authentic Handheld Layout) -->
        <section id="controller-section">
            <!-- Shoulder Triggers -->
            <div class="shoulders-bar">
                <button id="btn-l" class="shoulder-trigger btn-l" data-key="KeyA" aria-label="Gatilho L">
                    <span>L</span>
                </button>
                <div class="chassis-speaker-grille">
                    <span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <button id="btn-r" class="shoulder-trigger btn-r" data-key="KeyS" aria-label="Gatilho R">
                    <span>R</span>
                </button>
            </div>

            <!-- Main Controls Layout -->
            <div class="controls-main">
                <!-- D-Pad (Left Side) -->
                <div id="dpad-zone">
                    <div class="dpad-cross">
                        <button class="dpad-btn dpad-up" data-key="ArrowUp" aria-label="Cima">
                            <span class="arrow-glyph">▲</span>
                        </button>
                        <button class="dpad-btn dpad-right" data-key="ArrowRight" aria-label="Direita">
                            <span class="arrow-glyph">▶</span>
                        </button>
                        <button class="dpad-btn dpad-down" data-key="ArrowDown" aria-label="Baixo">
                            <span class="arrow-glyph">▼</span>
                        </button>
                        <button class="dpad-btn dpad-left" data-key="ArrowLeft" aria-label="Esquerda">
                            <span class="arrow-glyph">◀</span>
                        </button>
                        <div class="dpad-center-core"></div>
                    </div>
                </div>

                <!-- Select & Start (Centered, comfortably apart from B) -->
                <div id="center-zone">
                    <div class="rubber-pill-wrap">
                        <button class="rubber-pill" id="btn-select" data-key="ShiftRight" aria-label="Select"></button>
                        <span class="rubber-pill-label">SELECT</span>
                    </div>
                    <div class="rubber-pill-wrap">
                        <button class="rubber-pill" id="btn-start" data-key="Enter" aria-label="Start"></button>
                        <span class="rubber-pill-label">START</span>
                    </div>
                </div>

                <!-- Action Buttons A & B (Right Side, Natural Diagonal) -->
                <div id="action-zone">
                    <div class="action-btn-cluster">
                        <div class="action-btn-slot slot-b">
                            <button class="action-btn btn-b" data-key="KeyX" aria-label="Botão B">B</button>
                            <span class="btn-sub-label">B</span>
                        </div>
                        <div class="action-btn-slot slot-a">
                            <button class="action-btn btn-a" data-key="KeyZ" aria-label="Botão A">A</button>
                            <span class="btn-sub-label">A</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Settings Modal (Frosted Glass Overlay) -->
        <div id="settings-modal" class="modal-backdrop" style="display: none;">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>⚙️ Opções do Handheld</h3>
                    <button id="btn-close-settings" class="modal-close-btn" aria-label="Fechar">✕</button>
                </div>
                <div class="modal-body">
                    <!-- Touch Controls Customization -->
                    <div class="setting-group">
                        <h4>🎮 Controles Virtuais</h4>
                        
                        <div class="setting-row">
                            <label for="slider-opacity">Opacidade: <span id="val-opacity">80%</span></label>
                            <input type="range" id="slider-opacity" min="25" max="100" value="80" step="5">
                        </div>

                        <div class="setting-row">
                            <label>Tamanho dos Botões</label>
                            <div class="segmented-control" id="control-scale-group">
                                <button type="button" class="segment-btn" data-scale="0.85">Pequeno</button>
                                <button type="button" class="segment-btn active" data-scale="1.0">Padrão</button>
                                <button type="button" class="segment-btn" data-scale="1.15">Grande</button>
                            </div>
                        </div>

                        <div class="setting-row">
                            <label>Altura dos Controles</label>
                            <div class="segmented-control" id="control-pos-group">
                                <button type="button" class="segment-btn" data-pos="low">Baixo</button>
                                <button type="button" class="segment-btn active" data-pos="normal">Padrão</button>
                                <button type="button" class="segment-btn" data-pos="high">Alto</button>
                            </div>
                        </div>

                        <div class="setting-row setting-toggle">
                            <label for="toggle-haptic">Vibração ao Tocar (Haptics)</label>
                            <input type="checkbox" id="toggle-haptic" checked>
                        </div>
                    </div>

                    <!-- Graphic Filters -->
                    <div class="setting-group">
                        <h4>📺 Filtros de Vídeo</h4>
                        <div class="segmented-control vertical" id="filter-group">
                            <button type="button" class="segment-btn active" data-filter="pixel">
                                <strong>Pixel Art Nítido</strong> <span>(GBA 1:1 Puro)</span>
                            </button>
                            <button type="button" class="segment-btn" data-filter="lcd">
                                <strong>Matriz LCD Retrô</strong> <span>(Grade de pixels GBA)</span>
                            </button>
                            <button type="button" class="segment-btn" data-filter="crt">
                                <strong>CRT Scanlines</strong> <span>(Linhas de TV clássica)</span>
                            </button>
                            <button type="button" class="segment-btn" data-filter="smooth">
                                <strong>Suavizado HQ</strong> <span>(Anti-Aliasing)</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="nostalgist.umd.js"></script>
    <script src="app.js"></script>
</body>
</html>
