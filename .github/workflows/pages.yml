name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'index.html'
      - 'Wiki_Pokemon_Kanto_Johto.html'
      - 'graphics/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'wiki/package-lock.json'

      - name: Build React Wiki (Vite)
        run: |
          cd wiki
          npm ci
          npm run build
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -r wiki/dist/* _site/
          cp Wiki_Pokemon_Kanto_Johto.html _site/ || true
          cp Detonado_Interativo_Pokemon_Kanto_Johto.html _site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
