name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Wiki_Pokemon_Kanto_Johto.html'
      - 'Detonado_Interativo_Pokemon_Kanto_Johto.html'
      - 'graphics/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp Wiki_Pokemon_Kanto_Johto.html _site/
          cp Detonado_Interativo_Pokemon_Kanto_Johto.html _site/
          if [ -d "graphics" ]; then
            cp -r graphics _site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
