name: Build ROM and Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_rom:
    name: Compile GBA ROM
    runs-on: ubuntu-22.04
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Compile ROM
        run: |
          make -j$(nproc) all
          if [ -f "pokeClassic.gba" ]; then
            cp pokeClassic.gba Pokemon_Kanto_Johto.gba
          fi

      - name: Upload GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Kanto_Johto_ROM
          path: |
            Pokemon_Kanto_Johto.gba
            pokeClassic.gba
          if-no-files-found: error

  build_apk:
    name: Build Android APK
    needs: build_rom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download ROM Artifact
        uses: actions/download-artifact@v4
        with:
          name: Pokemon_Kanto_Johto_ROM
          path: rom_download

      - name: Prepare Android ROM Asset
        run: |
          mkdir -p android/app/src/main/assets
          if [ -f "rom_download/Pokemon_Kanto_Johto.gba" ]; then
            cp rom_download/Pokemon_Kanto_Johto.gba android/app/src/main/assets/game.gba
            cp rom_download/Pokemon_Kanto_Johto.gba ./Pokemon_Kanto_Johto.gba
          else
            cp rom_download/pokeClassic.gba android/app/src/main/assets/game.gba
            cp rom_download/pokeClassic.gba ./Pokemon_Kanto_Johto.gba
          fi
          ls -la android/app/src/main/assets/
          ls -la ./Pokemon_Kanto_Johto.gba

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Keystore
        run: |
          cd android/app
          keytool -genkeypair -v -keystore release.keystore -alias pokemonkj -keyalg RSA -keysize 2048 -validity 10000 -storepass pokemonkj -keypass pokemonkj -dname "CN=PokemonKJ, OU=Games, O=Antigravity, L=SP, ST=SP, C=BR"

      - name: Build APK with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p dist
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/Pokemon_Kanto_Johto.apk
          ls -la dist/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Kanto_Johto_APK
          path: dist/Pokemon_Kanto_Johto.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Pokémon Kanto & Johto (Versão Oficial)"
          body: |
            ## 🎮 Pokémon Kanto & Johto
            
            Versão oficial atualizada automaticamente a cada commit!
            
            ### 📥 Downloads Oficiais:
            - 💻 **`Pokemon_Kanto_Johto.gba`**: Arquivo de ROM para jogar no PC ou emuladores externos (Pizza Boy, MyBoy, etc.).
            - 📱 **`Pokemon_Kanto_Johto.apk`**: Aplicativo nativo em C/C++ para Android (instalação direta sem necessidade de emulador).
          files: |
            Pokemon_Kanto_Johto.gba
            dist/Pokemon_Kanto_Johto.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
